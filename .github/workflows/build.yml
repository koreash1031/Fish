name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            git \
            libffi-dev \
            libssl-dev \
            libtool \
            pkg-config \
            python3-dev \
            python3-pip \
            python3-setuptools \
            unzip \
            zip \
            zlib1g-dev \
            autoconf \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libgmp-dev \
            libmpc-dev \
            libmpfr-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libbz2-dev \
            libreadline-dev \
            libgdbm-dev \
            libgdbm-compat-dev \
            liblzma-dev \
            uuid-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.33 virtualenv buildozer

      - name: Build APK with Buildozer
        run: |
          # Automatically accept SDK licenses and run buildozer in debug mode
          yes | buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishBattle-APK
          path: bin/*.apk
